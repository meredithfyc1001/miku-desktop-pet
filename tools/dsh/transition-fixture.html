<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Miku 过渡效果检查</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; display: flex; background: rgb(20, 45, 60); }
  .stage { width: 640px; height: 360px; position: relative; flex: none; }
  .stack { position: absolute; inset: 0; }
  .stack.additive { isolation: isolate; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .half video { opacity: .5; }
  .additive video { mix-blend-mode: plus-lighter; }
</style>
<div class="stage"><div class="stack"><video preload="auto" muted playsinline></video></div></div>
<div class="stage"><div class="stack half"><video preload="auto" muted playsinline></video><video preload="auto" muted playsinline></video></div></div>
<div class="stage"><div class="stack half additive"><video preload="auto" muted playsinline></video><video preload="auto" muted playsinline></video></div></div>
<script>
  const src = new URLSearchParams(location.search).get('src');
  window.fixtureReady = Promise.all([...document.querySelectorAll('video')].map(video => new Promise((resolve, reject) => {
    video.addEventListener('loadeddata', () => { video.pause(); resolve(); }, { once: true });
    video.addEventListener('error', () => reject(new Error('Video could not be decoded')), { once: true });
    video.src = src;
  }))).then(() => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve))));
  window.setPhase = (phase, background) => {
    document.body.style.background = background;
    for (const stack of document.querySelectorAll('.half')) {
      const videos = stack.querySelectorAll('video');
      videos[0].style.opacity = String(1 - phase);
      videos[1].style.opacity = String(phase);
    }
    return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  };
</script>
</html>
